[package]
name = "eliteforge-agent-core"
description = "Shared contracts and runtime primitives for pluggable multimodal agents"
version.workspace = true
edition.workspace = true

[dependencies]
eliteforge-agent-plugin-kernel = { version = "0.1.0", path = "../eliteforge-agent-plugin-kernel" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.52.1", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
