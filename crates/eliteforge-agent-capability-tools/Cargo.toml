[package]
name = "eliteforge-agent-capability-tools"
version.workspace = true
edition.workspace = true
description = "Configurable filesystem and system-command tools for EliteForge Agent capability packs"

[dependencies]
eliteforge-agent-core = { path = "../eliteforge-agent-core", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
regex = "1"

[dev-dependencies]
eliteforge-agent-framework = { path = "../eliteforge-agent-framework", default-features = false }
eliteforge-agent-test-support = { path = "../eliteforge-agent-test-support" }
tempfile = "3"
