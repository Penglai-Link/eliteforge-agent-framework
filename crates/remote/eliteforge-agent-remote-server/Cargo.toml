[package]
name = "eliteforge-agent-remote-server"
description = "Axum remote listener, pairing, device registry, Noise tunnel and RPC dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
eliteforge-agent-remote-protocol = { path = "../eliteforge-agent-remote-protocol" }
eliteforge-agent-remote-rpc = { path = "../eliteforge-agent-remote-rpc" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
snow = "0.9"
tracing = "0.1"
url = "2"
ipnet = "2"
