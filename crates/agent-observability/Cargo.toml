[package]
name = "agent-observability"
description = "Privacy-preserving OpenTelemetry middleware for agent-framework"
version.workspace = true
edition.workspace = true
[dependencies]
agent-framework = { path = "../agent-framework" }
agent-plugin-kernel = { path = "../agent-plugin-kernel" }
async-trait.workspace = true
serde_json.workspace = true
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
[dev-dependencies]
agent-test-support = { path = "../agent-test-support" }
tempfile = "3"
futures.workspace = true
tokio.workspace = true
agent-state-sqlite = { path = "../agent-state-sqlite" }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "testing"] }
