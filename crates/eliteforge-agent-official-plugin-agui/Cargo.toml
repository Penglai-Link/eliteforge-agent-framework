[package]
name = "eliteforge-agent-official-plugin-agui"
description = "AG-UI event and SSE adapter for eliteforge-agent-framework"
version.workspace = true
edition.workspace = true

[dependencies]
eliteforge-agent-core = { path = "../eliteforge-agent-core" }
ag-ui = { version = "=0.3.0", default-features = false, features = ["sse"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
sha2 = "0.10"

[dev-dependencies]
eliteforge-agent-framework = { path = "../eliteforge-agent-framework", default-features = false }
eliteforge-agent-official-plugin-storage-sqlite = { path = "../eliteforge-agent-official-plugin-storage-sqlite" }
eliteforge-agent-test-support = { path = "../eliteforge-agent-test-support" }
ag-ui = { version = "=0.3.0", default-features = false, features = ["client", "verify"] }
futures.workspace = true
eliteforge-agent-state-sqlite = { path = "../eliteforge-agent-state-sqlite" }
eliteforge-agent-context = { path = "../eliteforge-agent-context" }
tempfile = "3"
