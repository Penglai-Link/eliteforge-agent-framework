[package]
name = "eliteforge-agent-capability-runtime"
description = "Versioned capability packages, process RPC and page sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eliteforge-agent-context-contracts = { path = "../eliteforge-agent-context-contracts" }
jsonschema = { version = "0.52.1", default-features = false }
eliteforge-agent-official-plugin-tools-mcp = { path = "../../plugin/tool/eliteforge-agent-official-plugin-tools-mcp" }
eliteforge-agent-plugin-core = { path = "../eliteforge-agent-plugin-core" }
eliteforge-agent-core = { path = "../eliteforge-agent-core" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std", "fs"] }
tokio-util.workspace = true
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
eliteforge-agent-test-support = { path = "../../testing/eliteforge-agent-test-support" }
tempfile = "3"
