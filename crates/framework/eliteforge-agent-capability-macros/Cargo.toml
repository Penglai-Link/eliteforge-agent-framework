[package]
name = "eliteforge-agent-capability-macros"
description = "Procedural macros for declaring EliteForge Agent capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing"] }

[dev-dependencies]
async-trait.workspace = true
eliteforge-agent-core = { path = "../eliteforge-agent-core" }
