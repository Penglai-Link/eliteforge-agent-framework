version.workspace = true
edition.workspace = true

[dependencies]
sqlite-extensions = { path = "../sqlite-extensions" }
agent-framework = { path = "../agent-framework" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }

[dev-dependencies]
agent-memory = { path = "../agent-memory" }
agent-test-support = { path = "../agent-test-support" }
tempfile = "3"
[[test]]
name = "crash_recovery"
harness = false
