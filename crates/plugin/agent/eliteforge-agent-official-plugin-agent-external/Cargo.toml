[package]
name = "eliteforge-agent-official-plugin-agent-external"
version.workspace = true
edition.workspace = true
description = "External Agent CLI and JSON bridge transports"

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core", version = "0.1.0" }
eliteforge-agent-official-plugin-tools-local = { path = "../../tool/eliteforge-agent-official-plugin-tools-local", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"
tokio = { workspace = true, features = ["io-util", "net", "process", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tempfile = "3"
