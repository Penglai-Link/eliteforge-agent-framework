[package]
name = "eliteforge-agent-official-plugin-storage-sqlite"
version.workspace = true
edition.workspace = true
description = "Default SQLite storage plugin for agent execution, interactions, conversations and memory"

[features]
default = []
bundled-native = ["eliteforge-agent-sqlite-extensions/bundled-native"]

[dependencies]
eliteforge-agent-sqlite-extensions = { path = "../eliteforge-agent-sqlite-extensions" }
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
eliteforge-agent-state-sqlite = { path = "../eliteforge-agent-state-sqlite" }
eliteforge-agent-memory = { path = "../../memory/eliteforge-agent-memory" }
eliteforge-agent-context = { path = "../../context/eliteforge-agent-context" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true

[dev-dependencies]
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-official-plugin-tools-human = { path = "../../tool/eliteforge-agent-official-plugin-tools-human" }
eliteforge-agent-official-plugin-agui = { path = "../../protocol/eliteforge-agent-official-plugin-agui" }
tempfile = "3"
tokio.workspace = true
