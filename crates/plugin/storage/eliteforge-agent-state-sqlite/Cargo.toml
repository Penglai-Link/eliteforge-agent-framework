[package]
name = "eliteforge-agent-state-sqlite"
description = "Transactional SQLite execution checkpoints with session fencing"
version.workspace = true
edition.workspace = true

[dependencies]
eliteforge-agent-sqlite-extensions = { path = "../eliteforge-agent-sqlite-extensions" }
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }

[dev-dependencies]
eliteforge-agent-official-plugin-storage-sqlite = { path = "../eliteforge-agent-official-plugin-storage-sqlite" }
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-memory = { path = "../../memory/eliteforge-agent-memory" }
eliteforge-agent-test-support = { path = "../../../testing/eliteforge-agent-test-support" }
tempfile = "3"
[[test]]
name = "crash_recovery"
harness = false
