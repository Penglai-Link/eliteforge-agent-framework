[package]
name = "eliteforge-agent-official-plugin-storage-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first Framework storage using SQLite for records and the filesystem for artifacts"
include = ["src/**", "build.rs", "resources/**", "Cargo.toml", "README.md", "tests/**", "examples/**"]

[features]
default = []
bundled-native = []

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
eliteforge-agent-context-contracts = { path = "../../../framework/eliteforge-agent-context-contracts" }
async-trait.workspace = true
futures.workspace = true
tracing = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
cap-std = "3"
cap-fs-ext = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["trace"] }
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-official-plugin-tools-human = { path = "../../tool/eliteforge-agent-official-plugin-tools-human" }
eliteforge-agent-official-plugin-agui = { path = "../../protocol/eliteforge-agent-official-plugin-agui" }
eliteforge-agent-test-support = { path = "../../../testing/eliteforge-agent-test-support" }

[[test]]
name = "crash_recovery"
harness = false
