[package]
name = "eliteforge-agent-official-plugin-tools-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Directory-confined local image and PDF text readers"

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
eliteforge-agent-official-plugin-tools-local = { path = "../eliteforge-agent-official-plugin-tools-local" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdf-extract = "0.12"

[dev-dependencies]
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-test-support = { path = "../../../testing/eliteforge-agent-test-support" }
tempfile = "3"
