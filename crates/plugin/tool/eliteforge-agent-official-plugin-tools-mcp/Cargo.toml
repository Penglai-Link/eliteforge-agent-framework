[package]
name = "eliteforge-agent-official-plugin-tools-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
libc = "0.2"
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
http = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
eliteforge-agent-official-plugin-storage-local = { path = "../../storage/eliteforge-agent-official-plugin-storage-local" }
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { workspace = true, features = ["net", "io-util"] }

[[test]]
name = "transport"
harness = false
