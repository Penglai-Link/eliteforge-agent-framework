[package]
name = "eliteforge-agent-official-plugin-otel-collector"
description = "Host-neutral OTLP HTTP receiver backed by the Framework telemetry storage port"
version.workspace = true
edition.workspace = true
[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
async-trait.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
serde_json.workspace = true
axum = "0.8"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "with-serde"] }
prost = "0.14"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
[dev-dependencies]
eliteforge-agent-official-plugin-storage-local = { path = "../../storage/eliteforge-agent-official-plugin-storage-local" }
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
