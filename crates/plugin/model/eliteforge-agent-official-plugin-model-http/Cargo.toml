[package]
name = "eliteforge-agent-official-plugin-model-http"
description = "Explicit single-attempt HTTP model protocols and host-configured connections"
version.workspace = true
edition.workspace = true

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core", version = "0.1.0" }
eliteforge-agent-official-plugin-model-genai = { path = "../eliteforge-agent-official-plugin-model-genai", version = "0.1.0" }
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "3baeeaaa69f04d883ada509c391dbd474d205429" }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }

rsa = "0.9"
rand = "0.8"
