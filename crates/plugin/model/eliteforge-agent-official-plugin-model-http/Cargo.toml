[package]
name = "eliteforge-agent-official-plugin-model-http"
description = "Explicit single-attempt HTTP model protocols and host-configured connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
eliteforge-agent-official-plugin-model-genai = { path = "../eliteforge-agent-official-plugin-model-genai" }
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tiktoken-rs = "0.12.1"
base64 = "0.22"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "d29d8ad" }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }

rsa = "0.9"
rand = "0.8"
