[package]
name = "eliteforge-agent-official-plugin-model-genai"
description = "genai protocol adapters for eliteforge-agent-framework model connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eliteforge-agent-core = { path = "../../../framework/eliteforge-agent-core" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
genai = "=0.7.0-beta.21"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-official-plugin-storage-local = { path = "../../storage/eliteforge-agent-official-plugin-storage-local" }
eliteforge-agent-test-support = { path = "../../../testing/eliteforge-agent-test-support" }
tokio = { workspace = true, features = ["net", "io-util"] }
