[dev-dependencies]
eliteforge-agent-framework = { path = "../../../framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-official-plugin-storage-sqlite = { path = "../../storage/eliteforge-agent-official-plugin-storage-sqlite" }
eliteforge-agent-test-support = { path = "../../../testing/eliteforge-agent-test-support" }
eliteforge-agent-state-sqlite = { path = "../../storage/eliteforge-agent-state-sqlite" }
tokio = { workspace = true, features = ["net", "io-util"] }
