[package]
name = "agent-agui"
description = "AG-UI event and SSE adapter for agent-framework"
version.workspace = true
edition.workspace = true

[dependencies]
agent-framework = { path = "../agent-framework" }
ag-ui = { version = "=0.3.0", default-features = false, features = ["sse"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
sha2 = "0.10"

[dev-dependencies]
agent-storage-sqlite = { path = "../agent-storage-sqlite" }
agent-test-support = { path = "../agent-test-support" }
ag-ui = { version = "=0.3.0", default-features = false, features = ["client", "verify"] }
futures.workspace = true
agent-state-sqlite = { path = "../agent-state-sqlite" }
agent-context = { path = "../agent-context" }
tempfile = "3"
