[package]
name = "agent-memory"
version.workspace = true
edition.workspace = true
description = "Persistent conversation storage and explicit long-term memory components"

[dependencies]
sqlite-extensions = { path = "../sqlite-extensions" }
agent-framework = { path = "../agent-framework", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agent-state-sqlite = { path = "../agent-state-sqlite" }
agent-test-support = { path = "../agent-test-support" }
agent-model-genai = { path = "../agent-model-genai" }
agent-context = { path = "../agent-context" }
tempfile = "3"
