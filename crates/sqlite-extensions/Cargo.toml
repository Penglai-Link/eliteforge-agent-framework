[package]
name = "sqlite-extensions"
version.workspace = true
edition.workspace = true
description = "Platform-aware loading of bundled sqlite-simple and sqlite-vec extensions"
include = ["src/**", "build.rs", "resources/**", "Cargo.toml", "README.md"]

[features]
default = []
bundled-native = []

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
async-trait.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
