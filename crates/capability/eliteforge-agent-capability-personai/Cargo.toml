[package]
name = "eliteforge-agent-capability-personai"
description = "PersonAI model adapters and typed SDK services for eliteforge-agent-framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eliteforge-agent-capability-auto-routing = { path = "../eliteforge-agent-capability-auto-routing" }
eliteforge-agent-core = { path = "../../framework/eliteforge-agent-core" }
eliteforge-agent-official-plugin-tools-discovery = { path = "../../plugin/tool/eliteforge-agent-official-plugin-tools-discovery" }
eliteforge-agent-framework = { path = "../../framework/eliteforge-agent-framework", default-features = false }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "85a70d4573813596739ec0a9a6c1ce33946f1e98" }
async-trait.workspace = true
base64 = "0.22"
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
eliteforge-agent-test-support = { path = "../../testing/eliteforge-agent-test-support" }
eliteforge-agent-plugin-core = { path = "../../framework/eliteforge-agent-plugin-core" }
rand = "0.8"
rsa = "0.9"
