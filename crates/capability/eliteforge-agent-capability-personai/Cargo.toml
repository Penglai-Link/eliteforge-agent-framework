[package]
name = "eliteforge-agent-capability-personai"
description = "PersonAI model adapters and typed SDK services for eliteforge-agent-framework"
version.workspace = true
edition.workspace = true

[dependencies]
eliteforge-agent-capability-auto-routing = { path = "../eliteforge-agent-capability-auto-routing", version = "0.1.0" }
eliteforge-agent-core = { path = "../../framework/eliteforge-agent-core", version = "0.1.0" }
eliteforge-agent-official-plugin-tools-discovery = { path = "../../plugin/tool/eliteforge-agent-official-plugin-tools-discovery", version = "0.1.0" }
eliteforge-agent-framework = { path = "../../framework/eliteforge-agent-framework", version = "0.1.0", default-features = false }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "b1e63a5e0199d09f000ad1d23b7e5559ee95710c" }
async-trait.workspace = true
base64 = "0.22"
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
eliteforge-agent-test-support = { path = "../../testing/eliteforge-agent-test-support", version = "0.1.0" }
eliteforge-agent-plugin-core = { path = "../../framework/eliteforge-agent-plugin-core", version = "0.1.0" }
rand = "0.8"
rsa = "0.9"
