[package]
name = "eliteforge-agent-integration-tests"
description = "Live-service integration smoke programs for EliteForge Agent Framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
live-model = [
    "dep:eliteforge-agent-framework",
    "dep:eliteforge-agent-official-plugin-storage-local",
    "dep:tokio",
]

[dependencies]
eliteforge-agent-framework = { path = "../crates/framework/eliteforge-agent-framework", optional = true }
eliteforge-agent-official-plugin-storage-local = { path = "../crates/plugin/storage/eliteforge-agent-official-plugin-storage-local", optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "default_model"
path = "src/bin/default_model.rs"
required-features = ["live-model"]
