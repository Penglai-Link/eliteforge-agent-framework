[workspace]
members = [
    "crates/eliteforge-agent-capability-macros",
    "crates/eliteforge-agent-capability-test-fixture",
    "crates/eliteforge-agent-capability-tools",
    "crates/eliteforge-agent-plugin-kernel",
    "crates/eliteforge-agent-framework",
    "crates/eliteforge-agent-core",
    "crates/eliteforge-agent-official-plugin-model-genai",
    "crates/eliteforge-agent-state-sqlite",
    "crates/eliteforge-agent-official-plugin-tools-mcp",
    "crates/eliteforge-agent-context",
    "crates/eliteforge-agent-memory",
    "crates/eliteforge-agent-official-plugin-otel",
    "crates/eliteforge-agent-official-plugin-agui",
    "crates/eliteforge-agent-official-plugin-tools-human",
    "crates/eliteforge-agent-official-plugin-storage-sqlite",
    "crates/eliteforge-agent-official-plugin-pack",
    "crates/eliteforge-agent-sqlite-extensions",
    "crates/eliteforge-agent-test-support",
    "integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
inventory = "0.3.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
