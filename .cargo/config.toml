# make supplies cache paths from the current user's home directory.
# Direct Cargo commands use sccache's defaults or the caller's environment.
[build]
rustc-wrapper = "sccache"
incremental = false

[env]
CCACHE_BASEDIR = { value = ".", relative = true }

# Gitee Git HTTP responses require the system Git transport.
[net]
git-fetch-with-cli = true
