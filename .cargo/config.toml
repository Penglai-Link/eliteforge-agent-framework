# Local compiler caching is opt-in: the Makefile exports RUSTC_WRAPPER when
# sccache is installed. Direct Cargo commands and CI build without sccache.
[build]
incremental = false

[env]
CCACHE_BASEDIR = { value = ".", relative = true }

# Gitee Git HTTP responses require the system Git transport.
[net]
git-fetch-with-cli = true
