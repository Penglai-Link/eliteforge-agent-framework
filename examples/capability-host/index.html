<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能力包开发宿主</title><link rel="icon" href="data:,">
<style>body{font:15px system-ui;margin:32px;color:#1f2937;background:#fafafa}h1{font-size:24px}button,input,select{font:inherit;padding:7px;margin-right:8px}nav{display:flex;gap:12px;margin:24px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:12px}#page iframe{width:100%;height:280px;border:1px solid #ddd;background:white}#status{white-space:pre-wrap;margin:16px 0}section{margin:24px 0}label{margin-right:16px}</style>
<h1>能力包开发宿主</h1><p>宿主管理安装、Agent 装配和页面挂载。插件页面通过专属通道连接自己的后端。</p>
<input id="archive" type="file" accept=".zip"><button id="import">导入能力包</button><button id="refresh">刷新</button>
<nav><button data-view="packs">能力包</button><button data-view="extensions">扩展点</button></nav><table id="catalog"></table>
<section><select id="selection"></select><label><input id="loop" type="checkbox">远程 AgentLoop</label><button id="build">构建 / 空闲切换</button><button id="run">执行示例任务</button></section>
<section><button id="open">挂载插件独立页面</button><button id="close">关闭页面</button><button id="theme">切换主题</button><button id="language">切换语言</button><div id="page"></div></section><pre id="status" role="status"></pre>
<script type="module">
import{mountCapabilityPage}from'/assets/sdk/page/dist/host.js';
let catalog,view='packs',mounted,context={theme:'light',language:'zh-CN',data:null};
const status=document.querySelector('#status');const report=value=>status.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);
async function api(path,data){const result=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!result.ok)throw new Error(await result.text());return result.json();}
function render(){const table=document.querySelector('#catalog');table.replaceChildren();const header=table.insertRow();for(const label of(view==='packs'?['能力包','版本','插件 / 实现 / 页面 / 资源','占用']:['扩展点','分类','契约 / 定义方 / 规则','可用实现 / 当前选择'])){const cell=document.createElement('th');cell.textContent=label;header.append(cell);}
for(const item of(view==='packs'?catalog.packs:catalog.extensions)){const row=table.insertRow();const manifest=item.manifest;const values=view==='packs'?[manifest.id,manifest.version,`${manifest.plugins.length} / ${manifest.implementations.length} / ${manifest.pages.length} / ${manifest.resources.length}`,catalog.usage.filter(u=>u.package===manifest.id&&u.version===manifest.version).map(u=>u.kind).join(', ')]:[item.contract.id,item.contract.category,`${item.contract.version} / ${item.contract.owner} / ${item.contract.multiplicity}`,item.implementations.map(([pack,version,implementation])=>`${pack}@${version}: ${implementation.id}${(catalog.selections??[]).some(s=>s.instance.package===pack&&s.instance.version===version&&s.implementations.includes(implementation.id))?' [已选择]':''}`).join(', ')];for(const value of values){row.insertCell().textContent=value;}}
const selection=document.querySelector('#selection'),previous=selection.value;selection.replaceChildren();for(const pack of catalog.packs){const option=document.createElement('option');option.value=`${pack.manifest.id}@${pack.manifest.version}`;option.textContent=option.value;selection.append(option);}if(previous)selection.value=previous;}
async function refresh(){catalog=await api('/api/catalog');render();}
function action(id,fn){document.querySelector(id).onclick=()=>Promise.resolve().then(fn).catch(error=>report(String(error)));}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{view=button.dataset.view;render();};
action('#refresh',refresh);action('#import',async()=>{const file=document.querySelector('#archive').files[0];if(!file)throw new Error('请先选择 ZIP 能力包');const response=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});if(!response.ok)throw new Error(await response.text());const pack=await response.json();report(`已导入 ${pack.manifest.id}@${pack.manifest.version}`);await refresh();});
action('#build',async()=>{const value=document.querySelector('#selection').value;const split=value.lastIndexOf('@');const implementations=['demo.chat','demo.state','demo.interactions','demo.conversations','demo.middleware','demo.custom'];if(document.querySelector('#loop').checked)implementations.push('demo.loop');report(await api('/api/build',{package:value.slice(0,split),version:value.slice(split+1),implementations}));await refresh();});
action('#run',async()=>report(await api('/api/run',{input:'hello'})));
action('#open',async()=>{if(mounted)throw new Error('请先关闭已有页面');await refresh();const instance=catalog.instances.find(i=>catalog.packs.some(p=>p.manifest.id===i.package&&p.manifest.version===i.version&&p.manifest.pages.some(page=>page.id==='demo.page')));if(!instance)throw new Error('请先构建 Agent');const initialization=await api('/api/pages',{instance,page:'demo.page',...context});const events=new EventSource(`/api/pages/${initialization.session}/events`);const pack=catalog.packs.find(p=>p.manifest.id===instance.package&&p.manifest.version===instance.version);const descriptor=pack.manifest.pages.find(p=>p.id===initialization.page);const pageMount=mountCapabilityPage(document.querySelector('#page'),{initialization,resourceUrl:`/resources/${initialization.session}/${descriptor.entry}`,async call(method,params,signal){const response=await fetch(`/api/pages/${initialization.session}/call`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instance,method,params}),signal});if(!response.ok)throw new Error(await response.text());return response.json();},async close(){events.close();await api(`/api/pages/${initialization.session}/close`,{});await refresh();}});mounted=pageMount;events.onmessage=event=>{const message=JSON.parse(event.data);if(mounted===pageMount&&message.session===initialization.session)pageMount.publish(message.topic,message.data);};report('页面已挂载');await refresh();});
action('#close',()=>{mounted?.close();mounted=undefined;report('页面已关闭');});action('#theme',()=>{context.theme=context.theme==='light'?'dark':'light';mounted?.context(context);});action('#language',()=>{context.language=context.language==='zh-CN'?'en':'zh-CN';mounted?.context(context);});
await refresh();
let revision=catalog.revision;
if(catalog.dev_refresh){const poll=async()=>{try{const latest=await api('/api/catalog');if(latest.revision!==revision){revision=latest.revision;const reopen=!!mounted;mounted?.close();mounted=undefined;catalog=latest;render();report('开发构建成功，实例已切换。');if(reopen)document.querySelector('#open').click();}}catch(error){report(String(error));}finally{setTimeout(poll,1000);}};setTimeout(poll,1000);}
</script></html>
